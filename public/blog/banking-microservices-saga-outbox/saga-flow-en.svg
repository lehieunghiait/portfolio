ke="#34d399" stroke-width="2" marker-end="url(#m34d399)"/><rect x="332" y="120" width="132" height="84" rx="14" fill="#141829" stroke="#8b6dff66" stroke-width="1.5" opacity="1.0"/><rect x="332" y="132" width="4" height="60" rx="2" fill="#8b6dff"/><text x="350" y="158.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#e8eaf4" text-anchor="start" opacity="1.0">Account</text><text x="350" y="178.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="450" fill="#9aa1bb" text-anchor="start" opacity="1.0">hold funds</text><text x="452" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#8b6dff" text-anchor="end" opacity="1.0">03</text><path d="M466,162.0 L486,162.0" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#m34d399)"/><rect x="490" y="120" width="132" height="84" rx="14" fill="#141829" stroke="#fbbf2466" stroke-width="1.5" opacity="1.0"/><rect x="490" y="132" width="4" height="60" rx="2" fill="#fbbf24"/><text x="508" y="158.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#e8eaf4" text-anchor="start" opacity="1.0">Gateway</text><text x="508" y="178.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="450" fill="#9aa1bb" text-anchor="start" opacity="1.0">send to switch</text><text x="610" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="end" opacity="1.0">04</text><path d="M624,162.0 L646,162.0" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#m34d399)"/><rect x="650" y="120" width="132" height="84" rx="14" fill="#141829" stroke="#22d3ee66" stroke-width="1.5" opacity="1.0"/><rect x="650" y="132" width="4" height="60" rx="2" fill="#22d3ee"/><text x="668" y="158.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#e8eaf4" text-anchor="start" opacity="1.0">Ledger</text><text x="668" y="178.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="450" fill="#9aa1bb" text-anchor="start" opacity="1.0">post entries</text><text x="770" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="end" opacity="1.0">05</text><path d="M784,162.0 L796,162.0" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#m34d399)"/><rect x="800" y="120" width="132" height="84" rx="14" fill="#141829" stroke="#22d3ee66" stroke-width="1.5" opacity="1.0"/><rect x="800" y="132" width="4" height="60" rx="2" fill="#22d3ee"/><text x="818" y="158.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="650" fill="#e8eaf4" text-anchor="start" opacity="1.0">Notify</text><text x="818" y="178.0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="450" fill="#9aa1bb" text-anchor="start" opacity="1.0">tell customer</text><text x="920" y="140" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#22d3ee" text-anchor="end" opacity="1.0">06</text><path d="M372,210 Q323.0,256.0 274,210" fill="none" stroke="#f87171" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#mf87171)"/><text x="323.0" y="256" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-