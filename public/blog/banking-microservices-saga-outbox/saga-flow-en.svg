="4 4"/><text x="866.0" y="274" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1.0">retry until done</text><rect x="20" y="372" width="920" height="76" rx="14" fill="#141829" stroke="#2b3150" stroke-width="1.5" opacity="1.0"/><circle cx="44" cy="410" r="6" fill="#34d399"/><text x="58" y="415" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa1bb" text-anchor="start" opacity="1.0">Next step</text><circle cx="272" cy="410" r="6" fill="#f87171"/><text x="286" y="415" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa1bb" text-anchor="start" opacity="1.0">Compensation</text><circle cx="500" cy="410" r="6" fill="#fbbf24"/><text x="514" y="415" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa1bb" text-anchor="start" opacity="1.0">Cannot be undone</text><circle cx="728" cy="410" r="6" fill="#22d3ee"/><text x="742" y="415" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#9aa1bb" text-anchor="start" opacity="1.0">Retry, never fail</text></svg>