m8b6dff)"/><text x="352.0" y="192" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#8b6dff" text-anchor="middle" opacity="1.0">GET /admin/messages · Bearer JWT</text><path d="M600,240 h44 v26 h-38" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#m22d3ee)"/><text x="656" y="257" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="650" fill="#22d3ee" text-anchor="start" opacity="1.0">verifyToken: chữ ký, hạn, azp</text><path d="M600,304 L356,304" fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#m22d3ee)"/><text x="478.0" y="294" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#22d3ee" text-anchor="middle" opacity="1.0">users.getUser(sub)</text><path d="M350,350 L594,350" fill="none" stroke="#f472b6" stroke-width="2" marker-end="url(#mf472b6)"/><text x="472.0" y="340" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#f472b6" text-anchor="middle" opacity="1.0">publicMetadata.role = admin</text><path d="M600,396 L844,396" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#m34d399)"/><text x="722.0" y="386" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle" opacity="1.0">SELECT … FROM messages</text><path d="M600,442 L116,442" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#m34d399)"/><text x="358.0" y="432" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#34d399" text-anchor="middle" opacity="1.0">200 · d