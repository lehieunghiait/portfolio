# Worker nhận form liên hệ từ portfolio và gửi email qua Cloudflare Email Service.
# Deploy: cd workers/contact && npx wrangler deploy
name = "portfolio-contact"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Chỉ cho phép gửi tới hộp thư của chủ trang (địa chỉ đã xác minh — miễn phí)
[[send_email]]
name = "EMAIL"
destination_address = "lehieunghia2402@gmail.com"

# Lưu tin nhắn để xem trong trang quản trị /admin
[[d1_databases]]
binding = "DB"
database_name = "portfolio-contact"
database_id = "05cd1ba1-8e33-470d-b4b5-d6145cd8ba17"
migrations_dir = "migrations"

[vars]
TO_EMAIL = "lehieunghia2402@gmail.com"
FROM_EMAIL = "contact@hieunghiagroup.online"
ALLOWED_ORIGINS = "https://hieunghiagroup.online,https://www.hieunghiagroup.online,https://hieunghiagroup.pages.dev,http://localhost:3000"

# Bí mật Turnstile đặt bằng: npx wrangler secret put TURNSTILE_SECRET
